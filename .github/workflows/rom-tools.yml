name: DNA Android Tools

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Pilih operasi"
        required: true
        type: choice
        options:
          - check-tools
          - resize
        default: check-tools
      image_url:
        description: "Direct download URL image (untuk resize)"
        required: false
        type: string
      resize_mb:
        description: "Tambahan ukuran image dalam MiB"
        required: false
        type: string
        default: "200"

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl file e2fsprogs android-sdk-libsparse-utils

      - name: Check tools
        if: inputs.action == 'check-tools'
        run: bash scripts/check-tools.sh

      - name: Resize image
        if: inputs.action == 'resize'
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          RESIZE_MB: ${{ inputs.resize_mb }}
        run: bash scripts/resize-image.sh

      - name: Upload result
        if: success() && inputs.action == 'resize'
        uses: actions/upload-artifact@v4
        with:
          name: dna-resized-image
          path: output/resized.img
          if-no-files-found: error
          retention-days: 3
