name: DNA Android Tools

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Pilih operasi"
        required: true
        type: choice
        options:
          - check-tools
          - unpack
          - repack
          - resize
          - convert
        default: check-tools

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip zip \
            python3 python3-pip \
            android-sdk-libsparse-utils \
            e2fsprogs erofs-utils f2fs-tools \
            device-tree-compiler lz4 zstd \
            brotli p7zip-full

      - name: Check tools
        if: inputs.action == 'check-tools'
        run: bash scripts/check-tools.sh

      - name: Validate operation
        run: |
          case "${{ inputs.action }}" in
            check-tools) ;;
            unpack|repack|resize|convert)
              echo "::notice::Operasi dipilih: ${{ inputs.action }}"
              echo "::notice::Implementasi operasi menunggu skrip dan format input."
              ;;
            *) echo "::error::Operasi tidak dikenal"; exit 1 ;;
          esac
